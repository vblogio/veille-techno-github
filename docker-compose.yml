services:
  backend:
    build: ./backend
#    ports:
#      - "8000:8000"
    volumes:
      - ./cache:/app/cache
      - ./output:/app/output
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    restart: unless-stopped
    networks:
      - veille-network

  frontend:
    build: ./frontend
#    ports:
#      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./output:/app/public/output
    restart: unless-stopped
    networks:
      - veille-network
    environment:
      - REACT_APP_API_URL=http://backend:8000

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - veille-network

networks:
  veille-network:
    driver: bridge

events {
    worker_connections 1024;  # Nombre de connexions simultanées autorisées
}

http {
    # Augmente le timeout pour les requêtes proxyfiées
    proxy_connect_timeout 300s;  # 5 minutes pour établir la connexion
    proxy_send_timeout 300s;     # 5 minutes pour envoyer la requête
    proxy_read_timeout 300s;     # 5 minutes pour recevoir la réponse

    server {
        listen 80;

        # Frontend (React)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend (FastAPI)
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gestion des erreurs
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
